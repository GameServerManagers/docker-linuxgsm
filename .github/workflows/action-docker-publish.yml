name: Docker Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint*.sh
      - ubuntu-versions.json
      - .github/workflows/action-docker-publish.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint*.sh
      - ubuntu-versions.json
      - .github/workflows/action-docker-publish.yml
  # Runs an hour after docker-steamcmd (01:00) so it builds on the fresh base image
  schedule:
    - cron: "0 2 * * 6"

permissions:
  contents: read

jobs:
  versions:
    name: Read Ubuntu versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read ubuntu-versions.json
        id: read
        run: echo "matrix=$(jq -c . ubuntu-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Ubuntu ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            gameservermanagers/linuxgsm
            ghcr.io/gameservermanagers/linuxgsm
          flavor: |
            latest=false
          tags: |
            type=raw,value=ubuntu-${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.latest }}
            type=raw,value=ubuntu,enable=${{ matrix.latest }}

      - name: Build (Ubuntu ${{ matrix.version }})
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: UBUNTU_VERSION=${{ matrix.version }}
          platforms: linux/amd64
          load: true
          tags: linuxgsm:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash linuxgsm:test -c '
            set -euo pipefail
            grep PRETTY_NAME /etc/os-release
            for cmd in curl gamedig git gosu jq nc node steamcmd tmux; do
              command -v "${cmd}" > /dev/null || { echo "missing: ${cmd}"; exit 1; }
            done
            cd /app
            gosu linuxgsm ./linuxgsm.sh list > /dev/null
            gosu linuxgsm steamcmd +login anonymous +quit
          '

      - name: Push (Ubuntu ${{ matrix.version }})
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: UBUNTU_VERSION=${{ matrix.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package-cleanup:
    name: Cleanup Old GitHub Packages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: linuxgsm
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
