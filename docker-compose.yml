services:
  linuxgsm:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        DISTRO: ubuntu
        DISTRO_VERSION: "26.04"
    container_name: gmodserver
    environment:
      - GAMESERVER=gmodserver
      - LGSM_GITHUBUSER=GameServerManagers
      - LGSM_GITHUBREPO=LinuxGSM
      - LGSM_GITHUBBRANCH=develop
    volumes:
      - /home/linuxgsm/gmodserver:/data
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27005:27005/udp"
      - "27020:27020/udp"
    restart: unless-stopped
